name: Sync Insights from WordPress

on:
  schedule:
    # 매 6시간마다 (UTC 기준 0/6/12/18시) — 발행 후 최대 6시간 내 자동 노출
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/fetch-insights.py"
      - ".github/workflows/sync-insights.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 이 스크립트는 data/insights.json 뿐 아니라
      # index.html, insights.html, sitemap.xml 도 함께 갱신합니다.
      # (뉴스레터 목록을 크롤러가 읽을 수 있도록 정적 HTML로 주입하기 때문)
      - name: Fetch RSS feed → JSON + 정적 HTML 주입
        run: python scripts/fetch-insights.py

      - name: Commit if changed
        run: |
          TRACKED="data/insights.json index.html insights.html sitemap.xml"
          if git diff --quiet -- $TRACKED; then
            echo "No content changes — skipping commit."
            exit 0
          fi
          echo "Changed files:"
          git diff --name-only -- $TRACKED
          git config user.name "feelyo-sync-bot"
          git config user.email "bot@feelyoworks.com"
          git add $TRACKED
          git commit -m "chore: sync WordPress insights ($(date -u '+%Y-%m-%d %H:%MZ'))"
          git push
